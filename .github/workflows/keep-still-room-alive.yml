name: Keep Still Room Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Render web service awake
        run: |
          curl -sS --location --max-time 30 --retry 2 --retry-delay 3             https://still-room-original.onrender.com/api/health             -o /dev/null || true
